# appcall merge gate.
#
# CI combines local Make targets with service-backed tests and container checks.
# A missing integration or build result is not a pass.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: public release hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/test-public-release.py
      - run: python3 scripts/public-release.py check --source . --index

  build-clean:
    name: locked Rust build
    runs-on: ubuntu-latest
    # Read-only. GitHub rejects expressions in permissions, and a write token
    # here would be available to the build. The cache is restored, not saved.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - name: Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal && rustup default 1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-release-check
          shared-key: release-check
          save-if: false
      # The image job links the release bins. This job only typechecks that
      # profile, so a pull request does not pay a second release codegen.
      - name: locked release check
        run: cargo check --locked --release -p appcall-api -p appcall-worker -p appcall-cli --bins

  runner-tests:
    name: runner tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The whole tree, not a curated file list. runner/live/ self-skips
      # without provider credentials, so no secrets are needed here.
      - name: bun test
        run: bun test runner/

      - name: connector generator tests
        run: make test-connector-gen

      - name: dashboard interactions
        run: make test-web

  rust-tests:
    name: Rust core and adapters
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: appcall
          POSTGRES_PASSWORD: appcall
          POSTGRES_DB: appcall_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appcall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APPCALL_ENGINE_POSTGRES_URL: postgres://appcall:appcall@localhost:5432/appcall_test?sslmode=disable
      APPCALL_TEST_DATABASE_URL: postgres://appcall:appcall@localhost:5432/appcall_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: native TLS build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev cmake
      - name: private PostgreSQL clusters for recovery contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client libpq-dev
          postgres_bin=$(pg_config --bindir)
          test -x "$postgres_bin/initdb"
          test -x "$postgres_bin/pg_ctl"
          echo "APPCALL_TEST_POSTGRES_BIN=$postgres_bin" >> "$GITHUB_ENV"
          echo "$postgres_bin" >> "$GITHUB_PATH"
      - name: Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy && rustup default 1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-dev
          shared-key: dev
          save-if: false
      - run: make check-rust test-rust
      - name: Rust dependency audit
        run: |
          curl -fsSL https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.1/cargo-audit-x86_64-unknown-linux-gnu-v0.22.1.tgz -o /tmp/cargo-audit.tgz
          echo "1890badd5f15831a9af4b074399fcd21e6f7c0fe42c84e9254cdffc9f813765c  /tmp/cargo-audit.tgz" | sha256sum -c -
          tar -xzf /tmp/cargo-audit.tgz -C /tmp
          mkdir -p /tmp/bin
          install -m 755 /tmp/cargo-audit-x86_64-unknown-linux-gnu-v0.22.1/cargo-audit /tmp/bin/cargo-audit
          export PATH="/tmp/bin:$PATH"
          cargo audit
      - name: PostgreSQL, concurrency and subprocess contracts
        run: make test-integration

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: pinned open-source secret scanner
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          GITLEAKS_BIN=/tmp/gitleaks python3 scripts/test-public-release.py
          # HEAD is this branch's history. --all also scans other open branches,
          # so an unmerged fixture fails pull requests that do not contain it.
          /tmp/gitleaks git --redact --no-banner --log-opts="HEAD" .

  images:
    name: container image builds
    runs-on: ubuntu-latest
    # This job publishes the image archive and the layer cache. No other job
    # receives actions: write, so pull-request tests cannot cancel workflow runs.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          tags: appcall-api:ci
          load: true
          cache-from: type=gha,scope=appcall-api
          cache-to: type=gha,scope=appcall-api,mode=max
      - name: runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          tags: appcall-runner:ci
          load: true
          cache-from: type=gha,scope=appcall-runner
          cache-to: type=gha,scope=appcall-runner,mode=max
      # Smoke boots these tags. The archive is already compressed; the
      # artifact action must not gzip it again.
      - name: Export images for smoke
        run: docker save appcall-api:ci appcall-runner:ci | gzip -1 > /tmp/ci-images.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ci-images
          path: /tmp/ci-images.tar.gz
          retention-days: 1
          compression-level: 0

  smoke-prod:
    name: production topology smoke
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: read
      actions: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: smoke safety fixture
        run: scripts/test-smoke-prod.sh
      - uses: actions/download-artifact@v4
        with:
          name: ci-images
          path: /tmp
      - name: Load images built once by the image job
        run: gzip -dc /tmp/ci-images.tar.gz | docker load
      - name: production topology smoke
        env:
          APPCALL_SMOKE_PORT: "0"
          APPCALL_SMOKE_API_IMAGE: appcall-api:ci
          APPCALL_SMOKE_RUNNER_IMAGE: appcall-runner:ci
          APPCALL_SMOKE_START_TIMEOUT_SECONDS: "900"
          APPCALL_SMOKE_COMMAND_TIMEOUT_SECONDS: "120"
          APPCALL_SMOKE_CLEANUP_TIMEOUT_SECONDS: "60"
          APPCALL_SMOKE_CLEANUP_STOP_TIMEOUT_SECONDS: "10"
        run: timeout --kill-after=30s 20m ./scripts/smoke-prod.sh
