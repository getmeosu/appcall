[package]
license.workspace = true
name = "appcall-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
appcall-connectors = { path = "../appcall-connectors" }
appcall-store = { path = "../appcall-store" }
appcall-actions = { path = "../appcall-actions" }
appcall-auth = { path = "../appcall-auth", features = ["postgres-store"] }
appcall-runner-client = { path = "../appcall-runner-client" }
appcall-oauth = { path = "../appcall-oauth" }
appcall-events = { path = "../appcall-events" }
appcall-provider = { path = "../appcall-provider" }
appcall-setup = { path = "../appcall-setup" }
appcall-runtime = { path = "../appcall-runtime" }
appcall-mcp = { path = "../appcall-mcp" }
appcall-web = { path = "../appcall-web" }
appcall-worker = { path = "../appcall-worker" }
postgres = "0.19"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread", "sync", "net", "io-util", "signal"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.3"
zeroize = "1"
sha2 = "0.10"
