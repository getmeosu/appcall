[package]
license.workspace = true
name = "appcall-actions"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
hmac = "0.12"
url = "2"
chrono = "0.4"
appcall-oauth = { path = "../appcall-oauth" }
appcall-connectors = { path = "../appcall-connectors" }
appcall-runner-client = { path = "../appcall-runner-client" }
appcall-store = { path = "../appcall-store" }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
