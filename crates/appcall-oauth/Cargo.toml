[package]
license.workspace = true
name = "appcall-oauth"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
appcall-store = { path = "../appcall-store" }
appcall-connectors = { path = "../appcall-connectors" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"
getrandom = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json", "form"] }

[dev-dependencies]
postgres = "0.19"
