[package]
license.workspace = true
name = "appcall-runtime"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
appcall-actions = { path = "../appcall-actions" }
appcall-connectors = { path = "../appcall-connectors" }
appcall-store = { path = "../appcall-store" }
appcall-oauth = { path = "../appcall-oauth" }
appcall-runner-client = { path = "../appcall-runner-client" }
postgres = "0.19"
serde_json = "1"
zeroize = "1"
getrandom = "0.4"
native-tls = "0.2"
postgres-native-tls = "0.5"
sqlx-core = { version = "=0.8.6", default-features = false, features = ["migrate", "_rt-tokio", "_tls-native-tls"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["migrate"] }
tokio = { version = "1", features = ["rt", "time", "net", "macros"] }
sha2 = "0.10"
base64 = "0.22"
