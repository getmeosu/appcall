[package]
license.workspace = true
name = "appcall-cli"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
appcall-runtime = { path = "../appcall-runtime" }
appcall-actions = { path = "../appcall-actions" }
appcall-connectors = { path = "../appcall-connectors" }
appcall-oauth = { path = "../appcall-oauth" }
appcall-runner-client = { path = "../appcall-runner-client" }
appcall-store = { path = "../appcall-store" }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
tokio = { version = "1", features = ["rt", "time", "signal"] }

[dev-dependencies]
tempfile = "3"
