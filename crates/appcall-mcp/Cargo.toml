[package]
license.workspace = true
name = "appcall-mcp"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
appcall-actions = { path = "../appcall-actions" }
appcall-connectors = { path = "../appcall-connectors" }
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["macros", "rt", "time"] }
