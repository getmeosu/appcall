[package]
license.workspace = true
name = "appcall-provider"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
appcall-store = { path = "../appcall-store" }
appcall-auth = { path = "../appcall-auth" }
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.3"
chrono = "0.4"
zeroize = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json"] }
