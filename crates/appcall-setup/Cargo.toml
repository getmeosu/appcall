[package]
license.workspace = true
name = "appcall-setup"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
appcall-store = { path = "../appcall-store" }
appcall-connectors = { path = "../appcall-connectors" }
appcall-oauth = { path = "../appcall-oauth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"
appcall-runner-client = { path = "../appcall-runner-client" }
tokio = { version = "1", features = ["rt-multi-thread"] }
[dev-dependencies]
postgres = "0.19"
