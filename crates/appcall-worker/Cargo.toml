[package]
license.workspace = true
name = "appcall-worker"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
appcall-runtime = { path = "../appcall-runtime" }
appcall-runner-client = { path = "../appcall-runner-client" }
appcall-events = { path = "../appcall-events" }
appcall-sync = { path = "../appcall-sync" }
appcall-oauth = { path = "../appcall-oauth" }
appcall-store = { path = "../appcall-store" }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
[dev-dependencies]
appcall-auth = { path = "../appcall-auth" }
appcall-connectors = { path = "../appcall-connectors" }
appcall-runner-client = { path = "../appcall-runner-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
