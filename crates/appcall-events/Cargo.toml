[package]
license.workspace = true
name = "appcall-events"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
appcall-store = { path = "../appcall-store" }
appcall-auth = { path = "../appcall-auth" }
postgres = { version = "0.19", features = ["with-serde_json-1", "with-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hmac = "0.13"
sha2 = "0.11"
