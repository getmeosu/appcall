[package]
license.workspace = true
name = "appcall-engine-http"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
appcall-engine = { path = "../appcall-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
appcall-engine-postgres = { path = "../appcall-engine-postgres", optional = true }
postgres = { version = "0.19", optional = true }
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[features]
default = []
postgres-backend = ["dep:appcall-engine-postgres", "dep:postgres"]
