[package]
license.workspace = true
name = "appcall-sync"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
appcall-runner-client = { path = "../appcall-runner-client" }
appcall-connectors = { path = "../appcall-connectors" }
appcall-store = { path = "../appcall-store" }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync"] }
[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
