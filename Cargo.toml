[workspace]
members = [
    "crates/appcall-engine",
    "crates/appcall-engine-postgres",
    "crates/appcall-engine-http",
    "crates/appcall-store",
    "crates/appcall-runner-client",
    "crates/appcall-connectors",
    "crates/appcall-auth",
    "crates/appcall-actions",
    "crates/appcall-oauth",
    "crates/appcall-api",
    "crates/appcall-events",
    "crates/appcall-setup",
    "crates/appcall-sync",
    "crates/appcall-worker",
    "crates/appcall-web",
    "crates/appcall-mcp",
    "crates/appcall-provider",
    "crates/appcall-cli",
    "crates/appcall-runtime",
]
default-members = ["crates/appcall-engine"]
resolver = "2"

[workspace.package]
license = "Elastic-2.0"
repository = "https://github.com/getmeosu/appcall"
