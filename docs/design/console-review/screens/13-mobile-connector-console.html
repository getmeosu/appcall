<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Mobile · Connector · appcall console review</title>
<link rel="stylesheet" href="../assets/signal.css">
<link rel="stylesheet" href="../assets/review-markers.css">
<script>if (/[?&]clean\b/.test(location.search)) document.documentElement.classList.add("clean");</script>
<style>
html, body { width:390px; min-height:900px; background:var(--ground); }
</style>
</head>
<body>
<!-- Static mockup. Frame 390×900. Sample data only; values in [brackets] are placeholders. -->
<div style="position:relative;width:390px;min-height:900px;background:var(--ground)">
<div style="min-height:100%;background:var(--ground)">
<header class="topbar" style="padding:0 16px;gap:12px"><span class="btn quiet sm" style="padding:0;color:var(--ink-100)">Menu</span><div class="crumbs"><span class="here">GitHub</span></div><span class="btn icon sm" style="margin-left:auto"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg></span></header>
<main class="main" style="padding:16px">
<div class="page-head" style="display:block;margin-bottom:16px"><h1>GitHub</h1><p style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag">OAuth</span><span class="state ok">Connected</span><span class="caption">1 account</span></p></div>
<div style="display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:hidden">
  <span style="padding:0 2px 8px;font-weight:600;white-space:nowrap;color:var(--iris-300);box-shadow:inset 0 -2px 0 var(--iris-400)">Tools</span><span style="padding:0 2px 8px;font-weight:600;white-space:nowrap;color:var(--ink-200);">Accounts</span><span style="padding:0 2px 8px;font-weight:600;white-space:nowrap;color:var(--ink-200);">Events</span><span style="padding:0 2px 8px;font-weight:600;white-space:nowrap;color:var(--ink-200);">Code</span><span style="padding:0 2px 8px;font-weight:600;white-space:nowrap;color:var(--ink-200);">Settings</span>
</div>
<div class="field" style="margin-bottom:16px"><label><span class="pin" style="margin-right:6px">1</span>Tool</label><div class="control select" style="min-height:44px"><span><strong style="color:var(--ink-50)">Create issue</strong> <span class="caption">· issues.create</span></span></div></div>
<section class="panel pad-c" style="display:grid;gap:14px">
  <div class="field"><label>Run as</label><div class="control select" style="min-height:44px"><span class="mono-mark" style="width:18px;height:18px;font-size:8px;border-radius:3px">GH</span>arvee@manavritti.com</div></div>
  <div class="field"><label>Repository</label><div class="control" style="min-height:44px">[owner]/[repo]</div></div>
  <div class="field"><label>Title</label><div class="control" style="min-height:44px">Dashboard: hide empty request panel</div></div>
  <div class="field"><label>Body <span class="muted">· optional</span></label><div class="control placeholder" style="min-height:72px;align-items:start">Markdown</div></div>
  <span class="disclosure" style="min-height:44px">Advanced</span>
  <span class="btn primary" style="min-height:44px"><svg viewBox="0 0 16 16"><path d="M5 3.5v9l7-4.5z"/></svg>Run tool</span>
</section>
<section class="panel pad-c" style="margin-top:12px;background:var(--ground)">
  <div style="display:flex;align-items:center;justify-content:space-between"><h3 class="section-title">Result</h3><span class="state idle">Ready</span></div>
  <p class="caption" style="margin-top:6px">Runs the tool as the selected account and records the call in Logs.</p>
</section>
</main>
</div>
</div>
</body>
</html>
