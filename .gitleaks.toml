# General form of the per-rule manifest stanzas above. Omitting targetRules
# attaches the allowlist to the global list (config.go: "Allowlists with
# |targetRules| aren't added to the global list"), so it applies to every rule.
# Any 64-hex release hash can match some token rule, so new artifact batches
# must not need a new stanza each time. Still narrow: the finding's path must be
# the manifest and its secret must be a bare sha256.
[[allowlists]]
description = "Release manifest SHA256 values for any rule; public-release.py independently validates exact file hashes"
condition = "AND"
paths = ['''(?:^|/)PUBLIC-RELEASE-MANIFEST\.json$''']
regexTarget = "secret"
regexes = ['''^[a-f0-9]{64}$''']

